version: '3.1'

services:
  scheduler:
    volumes:
      - ./.dvc-storage:/usr/local/airflow/.dvc-storage:rw
    environment:
      - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=True

  webserver:
    volumes:
      - ./.dvc-storage:/usr/local/airflow/.dvc-storage:rw
    environment:
      - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=True

  triggerer:
    volumes:
      - ./.dvc-storage:/usr/local/airflow/.dvc-storage:rw
    environment:
      - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=True

  # Extend the existing postgres service (don't override)
  postgres:
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5